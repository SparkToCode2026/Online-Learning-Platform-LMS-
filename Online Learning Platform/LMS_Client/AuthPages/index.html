<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LMS - Login / Register</title>
  <link rel="stylesheet" href="indexStyle.css">
</head>
<body>

  <div class="card">
    <!-- Header -->
    <div class="logo-container">
      <div class="logo-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
          <path d="M6 12v5c3 3 9 3 12 0v-5"/>
        </svg>
      </div>
      <div class="logo-text">LMS<span>Hub</span></div>
    </div>
    
    <p class="subtitle" id="form-subtitle">Join thousands of students and educators worldwide</p>

    <!-- Navigation Tabs -->
    <div class="tab-switcher">
      <button class="tab-btn active" id="login-tab">Login</button>
      <button class="tab-btn" id="register-tab">Register</button>
    </div>

    <!-- Login Form -->
    <form id="login-form" class="form-view active">
      <div class="form-group">
        <div class="label-row">
          <label for="login-email">Email Address</label>
        </div>
        <input type="email" id="login-email" placeholder="Please enter your email" required>
      </div>

      <div class="form-group">
        <div class="label-row">
          <label for="login-password">Password</label>
          <a href="#" class="forgot-link">Forgot?</a>
        </div>
        <div class="input-wrapper">
          <input type="password" id="login-password" placeholder="Please enter your password" required>
          <button type="button" class="toggle-password" id="toggle-password-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="submit-btn">Sign In to Dashboard</button>
    </form>

    <!-- Registration Form -->
    <form id="register-form" class="form-view">
      <div class="form-group">
        <div class="label-row">
          <label for="reg-name">Full Name</label>
        </div>
        <input type="text" id="reg-name" placeholder="Please enter your full name" required>
      </div>

      <div class="form-group">
        <div class="label-row">
          <label for="reg-email">Email Address</label>
        </div>
        <input type="email" id="reg-email" placeholder="Please enter your email" required>
      </div>

      <div class="form-group">
        <div class="label-row">
          <label for="reg-password">Password</label>
        </div>
        <div class="input-wrapper">
          <input type="password" id="reg-password" placeholder="Please enter your password" required>
        </div>
      </div>

      <div class="form-group">
        <div class="label-row">
          <label>I Am A:</label>
        </div>
        <div class="radio-group">
          <label class="radio-option selected" id="student-option">
            <input type="radio" name="role" value="student" checked>
            Student
          </label>
          <label class="radio-option" id="instructor-option">
            <input type="radio" name="role" value="instructor">
            Instructor
          </label>
        </div>
      </div>

      <button type="submit" class="submit-btn">Create Account</button>
    </form>
  </div>

  <script src="indexScript.js"></script>
</body>
</html>
