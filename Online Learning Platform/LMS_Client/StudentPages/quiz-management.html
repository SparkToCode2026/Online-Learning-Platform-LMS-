<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Management - LMSHub</title>
    <link rel="stylesheet" href="quiz-management.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon"><i class="fa-solid fa-graduation-cap"></i></div>
                <span class="brand-name">LMSHub</span>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item"><i class="fa-solid fa-book-open"></i><span>Courses</span></a>
                <a href="#" class="nav-item"><i class="fa-solid fa-folder-open"></i><span>Categories</span></a>
                <a href="#" class="nav-item"><i class="fa-solid fa-cubes"></i><span>Modules</span></a>
                <a href="#" class="nav-item"><i class="fa-solid fa-file-alt"></i><span>Lessons</span></a>
                <a href="#" class="nav-item"><i class="fa-solid fa-tasks"></i><span>Assignments</span></a>
                <a href="quiz-list.html" class="nav-item active"><i class="fa-solid fa-clock-rotate-left"></i><span>Quiz</span></a>
                <a href="#" class="nav-item"><i class="fa-solid fa-certificate"></i><span>Certificates</span></a>
            </nav>
            <div class="sidebar-footer">
                <a href="../AuthPages/index.html" class="nav-item logout"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a>
            </div>
        </aside>

        <!-- Main Content Workspace -->
        <main class="main-wrapper">
            <header class="page-header">
                <div class="header-titles">
                    <h1 class="page-heading">Quiz Management</h1>
                    <p class="page-subheading">Manage course quizzes and scores</p>
                </div>
            </header>

            <!-- Filters Bar & Action Button -->
            <div class="controls-bar">
                <div class="search-filter-group">
                    <div class="search-box">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="searchInput" placeholder="Search quizzes...">
                    </div>
                    <select id="courseFilter" class="filter-dropdown">
                        <option value="all">All Courses</option>
                    </select>
                    <button id="sortBtn" class="filter-btn"><i class="fa-solid fa-arrow-down-a-z"></i> Sort A-Z</button>
                </div>
                <button id="openCreateModalBtn" class="primary-btn">
                    <i class="fa-solid fa-plus"></i> Create Quiz
                </button>
                
            </div>

            <!-- Quizzes List Container -->
            <div id="quizList" class="quiz-list">
                <!-- Quizzes will be dynamically generated by Javascript -->
            </div>
        </main>
    </div>

    <!-- MODAL 1: Create New Quiz -->
    <div id="createModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Create New Quiz</h3>
                <button class="close-btn" data-close="createModal">&times;</button>
            </div>
            <form id="createQuizForm">
                <div class="form-group">
                    <label for="createTitle">Quiz Title</label>
                    <input type="text" id="createTitle" placeholder="e.g. Introduction to Variables" required>
                </div>
                <div class="form-group">
                    <label for="createScore">Quiz Score</label>
                    <input type="number" id="createScore" value="20" required>
                </div>
                <div class="form-group">
                    <label for="createCourse">Course</label>
                    <select id="createCourse" required>
                        <option value="">Select Course</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="cancel-btn" data-close="createModal">Cancel</button>
                    <button type="submit" class="primary-btn">Create Quiz</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL 2: Update Quiz -->
    <div id="updateModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Update Quiz</h3>
                <button class="close-btn" data-close="updateModal">&times;</button>
            </div>
            <form id="updateQuizForm">
                <input type="hidden" id="updateQuizId">
                <div class="form-group">
                    <label for="updateTitle">Quiz Title</label>
                    <input type="text" id="updateTitle" required>
                </div>
                <div class="form-group">
                    <label for="updateScore">Quiz Score</label>
                    <input type="number" id="updateScore" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="cancel-btn" data-close="updateModal">Cancel</button>
                    <button type="submit" class="primary-btn">Update</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL 3: Change Quiz Course -->
    <div id="changeCourseModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Change Quiz Course</h3>
                <button class="close-btn" data-close="changeCourseModal">&times;</button>
            </div>
            <form id="changeCourseForm">
                <input type="hidden" id="changeCourseQuizId">
                <div class="form-group">
                    <label>Quiz Title</label>
                    <input type="text" id="changeCourseQuizTitle" readonly class="readonly-input">
                </div>
                <div class="form-group">
                    <label>Current Course</label>
                    <input type="text" id="changeCourseCurrentName" readonly class="readonly-input highlight-field">
                </div>
                <div class="form-group">
                    <label for="changeCourseNewSelect">New Course</label>
                    <select id="changeCourseNewSelect" required>
                        <option value="">Select New Course</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="cancel-btn" data-close="changeCourseModal">Cancel</button>
                    <button type="submit" class="primary-btn">Update Course</button>
                </div>
            </form>
        </div>
    </div>

    
<!-- 1. Centralized API Helper (Always First) -->
    <script src="quizAPI.js"></script>

    <!-- 2. Page-Specific JavaScript File -->
    <script src="quiz-management.js"></script>>
</body>
</html>
