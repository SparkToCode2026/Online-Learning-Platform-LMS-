<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LMSHub - Available Courses</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap"
    rel="stylesheet">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="enrollCourses.css">
</head>

<body>

  <main class="courses-container">
    <!-- Top Navigation & Search Bar -->
    <header class="top-bar">
      <!-- Back Button to Enrollment Page -->
      <a href="enrollment.html" class="btn-back" title="Back to Enrollments">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </a>

      <!-- Search Input Container -->
      <div class="search-container">
        <div class="search-box-pill">
          <input type="text" id="search-input" class="search-input-field" placeholder="Search...">
          <button type="button" id="search-btn" class="btn-search">Search</button>
        </div>
      </div>
    </header>

    <!-- Courses Grid (populated from the database) -->
    <section class="courses-grid" id="courses-grid">
      <p class="empty-state-text" id="courses-empty-text">Loading courses...</p>
    </section>
  </main>

  <!-- Script -->
  <script type="module" src="enrollCourses.js"></script>
</body>

</html>
