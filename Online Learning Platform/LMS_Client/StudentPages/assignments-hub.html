<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LMSHub - Submissions Hub</title>
  <!-- Modern Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="enrollmentStyle.css">
  <link rel="stylesheet" href="assignments-hub.css">
</head>
<body>

  <div class="app-container">
    <!-- Separate Reusable Sidebar Container -->
    <div id="sidebar-container">
      <aside class="sidebar" id="student-sidebar">
        <div class="sidebar-header">
          <div class="logo">
            <div class="logo-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L2 12L12 22L22 12L12 2Z" fill="white"/>
              </svg>
            </div>
            <span class="logo-text">LMSHub</span>
          </div>
        </div>

        <nav class="sidebar-nav">
          <ul class="nav-list">
            <li class="nav-item">
              <a href="enrollment.html" class="nav-link" data-page="enrollment">
                <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                  <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                </svg>
                <span class="nav-label">Enroll</span>
              </a>
            </li>
            <li class="nav-item">
              <a href="assignments-hub.html" class="nav-link active" data-page="assignments">
                <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                  <polyline points="14 2 14 8 20 8"></polyline>
                  <line x1="16" y1="13" x2="8" y2="13"></line>
                  <line x1="16" y1="17" x2="8" y2="17"></line>
                </svg>
                <span class="nav-label">Assignments</span>
              </a>
            </li>
            <li class="nav-item">
              <a href="quiz-list.html" class="nav-link" data-page="quiz">
                <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                  <circle cx="12" cy="14" r="1"></circle>
                  <path d="M12 11c0-1 1-1.5 1.5-2.25.5-.75.5-1.5 0-2.25C13 5.75 12 5.5 11 6"></path>
                </svg>
                <span class="nav-label">Quiz</span>
              </a>
            </li>
            <li class="nav-item">
              <a href="../AuthPages/index.html" class="nav-link" data-page="logout">
                <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                  <polyline points="16 17 21 12 16 7"></polyline>
                  <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                <span class="nav-label">log out</span>
              </a>
            </li>
          </ul>
        </nav>

        <div class="sidebar-footer">
          <div class="user-profile">
            <div class="avatar">
              <span class="avatar-initials">MA</span>
            </div>
            <div class="user-info">
              <span class="user-name">Dr. Mike Andrew</span>
              <span class="user-role">Administrator</span>
            </div>
          </div>
        </div>
      </aside>
    </div>

    <!-- Main Content Area -->
    <main class="main-content">
      <div class="content-wrapper">
        <header class="page-header">
          <h1>Submissions Hub</h1>
          <p>Review incoming student work, apply marks, and update content templates</p>
          <hr>
        </header>

        <div class="table-container">
          <table class="submissions-table">
            <thead>
              <tr>
                <th>ASSIGNMENT TITLE</th>
                <th>COURSE NAME</th>
                <th>DEADLINE</th>
                <th>ACTIONS</th>
              </tr>
            </thead>
            <tbody id="submissions-table-body">
              <tr>
                <td colspan="4" class="text-muted">Loading assignments...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- JavaScript -->
  <script type="module" src="assignments-hub.js"></script>
</body>
</html>
