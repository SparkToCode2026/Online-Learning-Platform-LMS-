<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Assignment</title>
    <!-- Link to the external CSS file -->
    <link rel="stylesheet" href="assignmnetSubmission.css">
</head>
<body>

    <div class="container">
        <!-- Header Section -->
        <header class="header">
            <button class="back-btn" id="backBtn" aria-label="Go Back">
                <svg viewBox="0 0 24 24" fill="none">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </button>
            <h1>assignment name</h1>
        </header>

        <!-- Main Assignment Card -->
        <main class="card">
            <h2>Assignment Content</h2>
            
            <div class="textarea-wrapper">
                <textarea id="assignmentText" placeholder="Write your assignment here..."></textarea>
            </div>

            <div class="btn-container">
                <button class="create-btn" id="createBtn">Create</button>
            </div>
        </main>
    </div>

    <!-- Link to the external JavaScript file -->
    <script type="module" src="assignmnetSubmission.js"></script>
</body>
</html>
