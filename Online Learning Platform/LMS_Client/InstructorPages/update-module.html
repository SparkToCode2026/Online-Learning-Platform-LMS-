<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Update Module</title>

    <link rel="stylesheet" href="update-module.css">
</head>

<body>

<main class="update-module-page">

    <!-- Page Header -->
    <section class="page-header">
        <p class="page-label">ScholarHub</p>
        <h1>Update Module</h1>
    </section>


    <!-- Update Module Form -->
    <section class="form-card">

        <form id="updateModuleForm">

            <!-- Course -->
            <div class="form-group">
                <label for="course">Course</label>

                <select id="course" name="course">
                    <option>C# Programming</option>
                    <option>Web Development</option>
                    <option>Database Design</option>
                </select>
            </div>


            <!-- Module Title -->
            <div class="form-group">
                <label for="moduleTitle">Module Title</label>

                <input
                        type="text"
                        id="moduleTitle"
                        name="moduleTitle"
                        required
                >
            </div>


            <!-- Order Number -->
            <div class="form-group">
                <label for="orderNumber">Order Number</label>

                <input
                        type="number"
                        id="orderNumber"
                        name="orderNumber"
                        required
                >
            </div>


            <!-- Form Actions -->
            <div class="form-actions">

                <a href="module-management.html" class="cancel-button">
                    Cancel
                </a>

                <button type="submit" class="update-button">
                    Update Module
                </button>

            </div>

        </form>

    </section>

</main>

<script src="update-module.js"></script>
</body>
</html>
