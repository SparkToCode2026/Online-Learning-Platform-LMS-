<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScholarHub - Create Category</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="create_category.css">
</head>
<body>

  <!-- Main View -->
  <main>
    <div class="form-card">
      <a href="git_categories.html" class="close-btn">&times;</a>
      
      <!-- Standard ScholarHub Logo -->
      <div class="brand">
        <div class="brand-icon"><i class="fa-solid fa-graduation-cap"></i></div>
        <div class="brand-text">Scholar<span>Hub</span></div>
      </div>

      <h2 class="form-title">Create Course Category</h2>
      
      <div class="field-group">
        <label for="newCategoryName" class="form-label">CATEGORY NAME</label>
        <input type="text" id="newCategoryName" class="form-input" placeholder="Artificial Intelligence">
      </div>

      <div class="btn-container">
        <button type="button" class="btn-submit" id="submitBtn">Create</button>
      </div>
    </div>
  </main>

  <script src="create_category.js"></script>
</body>
</html>
