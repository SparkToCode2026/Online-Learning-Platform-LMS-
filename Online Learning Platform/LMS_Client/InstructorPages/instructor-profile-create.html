<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instructor profile Creation page</title>
    <link rel="stylesheet" href="instructor-profile-create.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon"><i class="fa-solid fa-graduation-cap"></i></div>
                <span class="brand-name">ScholarHub</span>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item"><i class="fa-solid fa-border-all"></i><span>Dashboard</span></a>
                <a href="#" class="nav-item"><i class="fa-solid fa-book-open"></i><span>Courses</span></a>
                <a href="#" class="nav-item"><i class="fa-solid fa-folder-open"></i><span>Categories</span></a>
                <a href="#" class="nav-item"><i class="fa-solid fa-cubes"></i><span>Modules</span></a>
                <a href="#" class="nav-item"><i class="fa-solid fa-file-alt"></i><span>Lessons</span></a>
                <a href="#" class="nav-item"><i class="fa-solid fa-tasks"></i><span>Assignments</span></a>
                <a href="#" class="nav-item"><i class="fa-solid fa-certificate"></i><span>Certificates</span></a>
            </nav>
            <div class="sidebar-footer">
                <a href="#" class="nav-item logout"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a>
            </div>
        </aside>

        <main class="main-wrapper">
            <div class="content-container">
                <h1 class="page-heading">Instructor profile Creation page</h1>
                
                <form id="createProfileForm" class="profile-form">
                    <div class="field-group">
                        <label for="nameInput">Name:</label>
                        <input type="text" id="nameInput" placeholder="Please Enter your name ..." required />
                    </div>

                    <div class="field-group">
                        <label for="bioInput">Biogrophy</label>
                        <input type="text" id="bioInput" placeholder="Please Enter your Biogrophy ..." required />
                    </div>

                    <div class="button-wrapper">
                        <button type="submit" class="primary-btn">Create</button>
                    </div>
                </form>

                <div id="responseMessage" class="response-message"></div>
            </div>
        </main>
    </div>

    <script src="instructor-profile-create.js"></script>
</body>
</html>
