<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Update Lesson</title>

    <link rel="stylesheet" href="update-lesson.css">
</head>

<body>

<main class="update-lesson-page">

    <!-- Page Header -->
    <section class="page-header">
        <p class="page-label">ScholarHub</p>
        <h1>Update Lesson</h1>
    </section>


    <!-- Update Lesson Form -->
    <section class="form-card">

        <form id="updateLessonForm">

            <!-- Module -->
            <div class="form-group">

                <label for="module">
                    Module
                </label>

                <select
                        id="module"
                        name="module"
                        required
                >
                    <option value="">
                        Select Module
                    </option>
                </select>

            </div>


            <!-- Lesson Title -->
            <div class="form-group">

                <label for="lessonTitle">
                    Lesson Title
                </label>

                <input
                        type="text"
                        id="lessonTitle"
                        name="lessonTitle"
                        required
                >

            </div>


            <!-- Lesson URL -->
            <div class="form-group">

                <label for="lessonURL">
                    Lesson URL
                </label>

                <input
                        type="url"
                        id="lessonURL"
                        name="lessonURL"
                        required
                >

            </div>


            <!-- Buttons -->
            <div class="form-actions">

                <a
                        href="lessons.html"
                        id="cancelButton"
                        class="cancel-button"
                >
                    Cancel
                </a>

                <button
                        type="submit"
                        class="update-button"
                >
                    Update Lesson
                </button>

            </div>

        </form>

    </section>

</main>


<script type="module" src="update-lesson.js"></script>

</body>
</html>
