<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Quiz</title>
    <link rel="stylesheet" href="update-quiz-modal.css">
</head>
<body>
<div class="modal-overlay active" id="updateQuizModal">
    <div class="modal-card">
        <div class="modal-header">
            <div>
                <h2>Update Quiz</h2>
                <p>Update the quiz title and score.</p>
            </div>
            <button
                    type="button"
                    id="closeModalBtn"
                    class="close-btn"
            >
                &times;
            </button>
        </div>

        <form id="updateQuizForm">
            <!-- Hidden Quiz ID -->
            <input
                    type="hidden"
                    id="quizId"
            >

            <!-- Quiz Title -->
            <div class="form-group">
                <label for="quizTitle">
                    Quiz Title
                </label>
                <input
                        type="text"
                        id="quizTitle"
                        placeholder="Enter quiz title"
                        required
                >
            </div>

            <!-- Quiz Score -->
            <div class="form-group">
                <label for="quizScore">
                    Quiz Score
                </label>
                <input
                        type="number"
                        id="quizScore"
                        min="0"
                        step="0.01"
                        placeholder="Enter quiz score"
                        required
                >
            </div>

            <!-- Buttons -->
            <div class="modal-actions">
                <button
                        type="button"
                        id="cancelBtn"
                        class="cancel-btn"
                >
                    Cancel
                </button>
                <button
                        type="submit"
                        class="update-btn"
                >
                    Update Quiz
                </button>
            </div>
        </form>
    </div>
</div>

<script src="update-quiz-modal.js"></script>
</body>
</html>
