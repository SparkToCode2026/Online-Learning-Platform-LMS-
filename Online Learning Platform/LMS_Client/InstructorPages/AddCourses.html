<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add New Course</title>
  <link rel="stylesheet" href="AddCourses.css">
</head>

<body>
  <div class="page-container">

    <!-- Top left page title -->
    <div class="page-header">
      <p>Add New Course</p>
    </div>

    <!-- Main Content Area -->
    <main class="main-wrapper">

      <!-- Back Button -->
      <button class="btn-back" id="backBtn" aria-label="Go Back">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 12H4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M10 18L4 12L10 6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>

      <!-- Center Card -->
      <div class="form-card">

        <!-- Logo Header -->
        <div class="logo-container">
          <svg class="logo-icon" width="24" height="20" viewBox="0 0 24 20" fill="none"
            xmlns="http://www.w3.org/2000/svg">
            <path d="M12 0L24 6.5L12 13L0 6.5L12 0Z" fill="#F45B3E" />
            <path d="M12 20L24 13.5V17L12 23.5L0 17V13.5L12 20Z" fill="#F45B3E" />
          </svg>
          <span class="logo-text">Scholar<span class="logo-highlight">Hub</span></span>
        </div>

        <h1 class="card-title">Create New Course</h1>

        <!-- Form -->
        <form id="createCourseForm">

          <div class="input-group">
            <label for="courseName">COURSE NAME</label>
            <input type="text" id="courseName" name="courseName" value="C# Programming" required>
          </div>

          <div class="input-group">
            <label for="coursePrice">COURSE PRICE</label>
            <input type="text" id="coursePrice" name="coursePrice" value="OMR 25.0" required>
          </div>

          <div class="input-group">
            <label for="category">CATEGORY</label>
            <div class="select-wrapper">
              <select id="category" name="category" required>
                <option value="Programming" selected>Programming</option>
                <option value="Design">Design</option>
                <option value="Business">Business</option>
              </select>
            </div>
          </div>

          <div class="input-group">
            <label for="instructor">INSTRUCTOR</label>
            <div class="select-wrapper">
              <select id="instructor" name="instructor" required>
                <option value="Dr.Mike Andrew" selected>Dr.Mike Andrew</option>
                <option value="Prof. Jane Doe">Prof. Jane Doe</option>
              </select>
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn-create">Create</button>
          </div>

        </form>
      </div>
    </main>
  </div>
  <script src="AddCourses.js"></script>
</body>

</html>
