<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Module Management</title>

    <link rel="stylesheet" href="module-management.css">
</head>

<body>

<div class="page-container">

    <!-- Sidebar -->
    <aside class="sidebar">

        <!-- ScholarHub Logo -->
        <div>
            <div class="logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 7.5 12 3l9 4.5-9 4.5-9-4.5Z"></path>
                        <path d="M6 10v5.5c0 1.5 2.7 3.5 6 3.5s6-2 6-3.5V10"></path>
                    </svg>
                </div>

                <span>
                    Scholar<span class="logo-orange">Hub</span>
                </span>
            </div>

            <!-- Navigation -->
            <nav class="sidebar-nav">

                <a href="#">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                    </svg>
                    <span>Dashboard</span>
                </a>

                <a href="#" >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3.5 5.5C5.8 4.5 8.3 4.7 11 6v13c-2.7-1.3-5.2-1.5-7.5-.5V5.5Z"></path>
                        <path d="M20.5 5.5C18.2 4.5 15.7 4.7 13 6v13c2.7-1.3 5.2-1.5 7.5-.5V5.5Z"></path>
                    </svg>
                    <span>Courses</span>
                </a>

                <a href="#">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 7h6l2 2h10v10H3z"></path>
                    </svg>
                    <span>Categories</span>
                </a>

                <a href="#" class="active">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 2 4 6v12l8 4 8-4V6z"></path>
                        <path d="m4 6 8 4 8-4M12 10v12"></path>
                    </svg>
                    <span>Modules</span>
                </a>

                <a href="#">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="5" y="3" width="14" height="18" rx="2"></rect>
                        <path d="M8 8h8M8 12h8M8 16h5"></path>
                    </svg>
                    <span>Lessons</span>
                </a>

                <a href="#">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="5" y="4" width="14" height="17" rx="2"></rect>
                        <path d="M9 2v4M15 2v4M8 10h8M8 14h5"></path>
                    </svg>
                    <span>Assignments</span>
                </a>

                <a href="#">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="10" r="6"></circle>
                        <path d="m9 15-1 6 4-2 4 2-1-6"></path>
                    </svg>
                    <span>Certificates</span>
                </a>

            </nav>
        </div>

        <div class="sidebar-footer">
            <button class="logout-button" type="button">

                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M10 5H5v14h5"></path>
                    <path d="M14 8l4 4-4 4"></path>
                    <path d="M18 12H9"></path>
                </svg>

                <span>Logout</span>
            </button>
        </div>
    </aside>


        <!-- Main Content -->
    <main class="main-content">

        <!-- Header -->
        <header class="page-header">

            <div>
                <h1>Module Management</h1>
                <p>Manage course modules, lessons, and their order</p>
            </div>

            <div class="header-actions">

                <!-- Search -->
                <div class="search-box">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="11" cy="11" r="7"></circle>
                        <path d="m20 20-4-4"></path>
                    </svg>

                    <input
                            type="text"
                            placeholder="Search modules..."
                            id="searchInput"
                    >
                </div>

                <!-- Course Filter -->
                <select id="courseFilter">
                    <option>All Courses</option>
                    <option>C# Programming</option>
                    <option>Web Development</option>
                </select>

            </div>

        </header>


        <!-- Module Cards -->
        <section class="modules-grid">

                <!-- Modules will be displayed by JavaScript -->
            </section>


        <!-- Create New Module -->
        <div class="create-module">

            <a href="create-module.html" class="create-module-link">

        <span class="plus-icon">
            +
        </span>

                <span>
            Create New Module
        </span>

            </a>

        </div>

    </main>

</div>
<!-- Delete Module Confirmation Modal -->
<div id="deleteModuleModal" class="delete-modal hidden">

    <div class="delete-modal-box">

        <div class="delete-icon">!</div>

        <h3>Delete Module?</h3>

        <p>Are you sure you want to delete this module?</p>

        <div class="delete-modal-actions">

            <button
                    id="cancelModuleDelete"
                    class="cancel-delete-button"
                    type="button"
            >
                Cancel
            </button>

            <button
                    id="confirmModuleDelete"
                    class="confirm-delete-button"
                    type="button"
            >
                Delete
            </button>

        </div>

    </div>

</div>
<!-- module-management.html -->
<script src="module-management.js"></script>
</body>
</html>
