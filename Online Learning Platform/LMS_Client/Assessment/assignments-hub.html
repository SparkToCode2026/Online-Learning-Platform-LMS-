<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignments & Submissions Hub</title>
    <link rel="stylesheet" href="assignments-hub.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon"><i class="fa-solid fa-graduation-cap"></i></div>
                <span class="brand-name">ScholarHub</span>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item"><i class="fa-solid fa-border-all"></i><span>Dashboard</span></a>
                <a href="#" class="nav-item"><i class="fa-solid fa-book-open"></i><span>Courses</span></a>
                <a href="#" class="nav-item"><i class="fa-solid fa-folder-open"></i><span>Categories</span></a>
                <a href="#" class="nav-item"><i class="fa-solid fa-cubes"></i><span>Modules</span></a>
                <a href="#" class="nav-item"><i class="fa-solid fa-file-alt"></i><span>Lessons</span></a>
                <a href="assignments-hub.html" class="nav-item active"><i class="fa-solid fa-tasks"></i><span>Assignments</span></a>
                <a href="quiz-management.html" class="nav-item"><i class="fa-solid fa-clock-rotate-left"></i><span>Quiz</span></a>
                <a href="#" class="nav-item"><i class="fa-solid fa-certificate"></i><span>Certificates</span></a>
            </nav>
            <div class="sidebar-footer">
                <a href="#" class="nav-item logout"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a>
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="main-wrapper">
            <header class="page-header">
                <div class="header-titles">
                    <h1 class="page-heading">Assignments & Submissions Hub</h1>
                    <p class="page-subheading">Manage, review, and track all course assignments</p>
                </div>
                <button class="primary-btn" onclick="window.location.href='assessment-creator.html'">+ Create New Assignment</button>
            </header>

            <!-- Table Container -->
            <div class="table-card">
                <table class="assignments-table">
                    <thead>
                        <tr>
                            <th>ASSIGNMENT TITLE</th>
                            <th>COURSE NAME</th>
                            <th>DEADLINE</th>
                            <th>SUBMISSIONS</th>
                            <th>STATUS</th>
                            <th class="text-center">ACTIONS</th>
                        </tr>
                    </thead>
                    <tbody id="assignmentsTableBody">
                        <!-- Dynamic data rows generated by JS -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Edit Assignment Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-box">
            <div class="modal-header">Edit Assignment Details</div>
            <div class="form-group">
                <label>Assignment Title</label>
                <input type="text" id="editTitle">
            </div>
            <div class="form-group">
                <label>Course Name</label>
                <input type="text" id="editCourse">
            </div>
            <div class="form-group">
                <label>Deadline</label>
                <input type="date" id="editDeadline">
            </div>
            <div class="form-group">
                <label>Status</label>
                <select id="editStatus">
                    <option value="Active">Active</option>
                    <option value="Closed">Closed</option>
                    <option value="Draft">Draft</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                <button class="btn-save" onclick="saveAssignmentChanges()">Save Changes</button>
            </div>
        </div>
    </div>

    <script>
        // Initial Assignment Dataset
        let assignments = [
            { id: 1, title: 'React Components Lab', course: 'Advanced Web UI', deadline: '2026-10-15', submissions: '45 / 50', status: 'Active' },
            { id: 2, title: 'Database Schema Design', course: 'Relational Databases', deadline: '2026-10-18', submissions: '38 / 42', status: 'Active' },
            { id: 3, title: 'UX Research Report', course: 'Interaction Design', deadline: '2026-10-10', submissions: '30 / 30', status: 'Closed' },
            { id: 4, title: 'Python Data Structures', course: 'Intro to Programming', deadline: '2026-11-01', submissions: '0 / 60', status: 'Draft' },
            { id: 5, title: 'API Integration Project', course: 'Advanced Web UI', deadline: '2026-10-25', submissions: '12 / 50', status: 'Active' }
        ];

        let currentEditingId = null;

        // Render Table Rows Dynamically
        function renderTable() {
            const tbody = document.getElementById('assignmentsTableBody');
            tbody.innerHTML = '';

            assignments.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="title-cell">${item.title}</td>
                    <td>${item.course}</td>
                    <td>${item.deadline}</td>
                    <td>${item.submissions}</td>
                    <td><span class="status-badge ${item.status.toLowerCase()}">${item.status}</span></td>
                    <td class="text-center">
                        <div class="action-btns-group">
                            <button class="btn-table-action" onclick="openEditModal(${item.id})">Edit</button>
                            <button class="btn-table-action delete" onclick="deleteAssignment(${item.id})"><i class="fa-regular fa-trash-can"></i></button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Populate and Open Edit Modal
        function openEditModal(id) {
            currentEditingId = id;
            const item = assignments.find(a => a.id === id);
            
            document.getElementById('editTitle').value = item.title;
            document.getElementById('editCourse').value = item.course;
            document.getElementById('editDeadline').value = item.deadline;
            document.getElementById('editStatus').value = item.status;

            document.getElementById('editModal').style.display = 'flex';
        }

        // Close Edit Modal
        function closeModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        // Save Modifications to Array and Re-render
        function saveAssignmentChanges() {
            const item = assignments.find(a => a.id === currentEditingId);
            if (item) {
                item.title = document.getElementById('editTitle').value;
                item.course = document.getElementById('editCourse').value;
                item.deadline = document.getElementById('editDeadline').value;
                item.status = document.getElementById('editStatus').value;
                renderTable();
            }
            closeModal();
        }

        // Delete Row Functionality
        function deleteAssignment(id) {
            if (confirm('Are you sure you want to delete this assignment?')) {
                assignments = assignments.filter(a => a.id !== id);
                renderTable();
            }
        }

        // Initialize Table on DOM Content Loaded
        document.addEventListener('DOMContentLoaded', renderTable);
    </script>
</body>
</html>
