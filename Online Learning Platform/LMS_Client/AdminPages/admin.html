<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LMSHub - User Management</title>
  <link rel="stylesheet" href="adminStyle.css">
</head>
<body>

  <main class="admin-container">
    <!-- Top Header & Controls -->
    <header class="admin-header">
      <div class="header-titles">
        <h1>User Management</h1>
        <p>Manage university roster, adjust roles, and approve registrations</p>
      </div>

      <div class="header-controls">
        <div class="search-box">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="user-search" placeholder="Search here...">
        </div>

        <div class="select-wrapper">
          <select id="role-filter" class="role-select">
            <option value="all">All Roles</option>
            <option value="student">Student</option>
            <option value="instructor">Instructor</option>
            <option value="admin">Admin</option>
          </select>
          <svg class="select-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>
      </div>
    </header>

    <!-- User Table -->
    <div class="table-card">
      <table class="user-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th class="text-right">Actions</th>
          </tr>
        </thead>
        <tbody id="user-table-body">
          <tr>
            <td colspan="5" style="text-align: center; padding: 24px; color: #8C827A;">Loading users...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Logout Button -->
    <footer class="admin-footer">
      <a href="../AuthPages/index.html" class="btn-logout" id="btn-logout">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Logout</span>
      </a>
    </footer>
  </main>

  <script type="module" src="adminScript.js"></script>
</body>
</html>
